name: Modal GPU (development)

# Cloud-only deployment of the optional hosted GPU model (infra/modal/serve_qwen.py).
# Manual trigger only: nothing runs on push, and nothing here touches Vercel, Supabase or production.
#
# CREDENTIALS: MODAL_TOKEN_ID and MODAL_TOKEN_SECRET must be secrets of the GitHub Environment named `modal` (Settings > Environments > modal),
# NOT repository secrets. That environment's "Deployment branches and tags" must be limited to `main`. GitHub then refuses to start the job
# (and withholds the secrets) on any other ref, even if someone edits this file on a branch. The in-file checks below are defence in depth.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "verify = auth check only (free) | billing = read-only spend report (free) | deploy = build + deploy the endpoint (no GPU runs until a request arrives; small CPU image-build cost) | benchmark = deploy + send benchmark requests (GPU cost)"
        type: choice
        default: verify
        options: [verify, billing, deploy, benchmark]
      gpu:
        description: "GPU for deploy/benchmark"
        type: choice
        default: L4
        options: [L4, A10]
      confirm:
        description: 'Type exactly "I APPROVE MODAL COST" to run deploy or benchmark (ignored for verify/billing)'
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: modal-gpu
  cancel-in-progress: false

jobs:
  # Any ref other than main: nothing that can reach Modal credentials starts. This job has no environment and no secrets.
  refuse-off-main:
    if: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::The Modal workflow only runs from main (selected ref: $GITHUB_REF)."
          exit 1

  modal:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The ONLY job that references Modal credentials. Environment secrets are available only to jobs that name the environment.
    environment: modal
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      # No credentials are present in this step's environment.
      - name: Install Modal client (pinned)
        run: pip install --quiet "modal==1.6.4"

      # Credentials are attached only to the steps that call Modal, never to the whole job.
      - name: Verify authentication (read-only, free)
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: ./scripts/verify-modal-auth.sh

      - name: Billing summary (read-only, free)
        if: inputs.mode == 'billing' || inputs.mode == 'benchmark'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal billing summary 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Require explicit cost approval
        if: inputs.mode == 'deploy' || inputs.mode == 'benchmark'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          [ "$CONFIRM" = "I APPROVE MODAL COST" ] || { echo "::error::deploy/benchmark need confirm = I APPROVE MODAL COST"; exit 1; }

      - name: Deploy endpoint (development app clicky-qwen)
        id: deploy
        if: inputs.mode == 'deploy' || inputs.mode == 'benchmark'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          CLICKY_GPU: ${{ inputs.gpu }}
        run: |
          modal deploy infra/modal/serve_qwen.py 2>&1 | tee deploy.log
          url=$(grep -Eo 'https://[A-Za-z0-9._-]+\.modal\.run' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          { echo "### Endpoint"; echo "MODAL_LLM_URL=$url"; echo; echo "Set this (not secret) as MODAL_LLM_URL in the app environment you want to use it (Preview first)."; } >> "$GITHUB_STEP_SUMMARY"

      - name: "Benchmark (GPU cost - cold start and two streamed generations)"
        if: inputs.mode == 'benchmark'
        env:
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_LLM_URL: ${{ steps.deploy.outputs.url }}
        run: |
          python infra/modal/benchmark.py | tee bench.json
          { echo "### Benchmark (${{ inputs.gpu }})"; echo '```json'; cat bench.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop the app after benchmarking (so nothing keeps running)
        if: inputs.mode == 'benchmark' && always()
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal app stop clicky-qwen || true
